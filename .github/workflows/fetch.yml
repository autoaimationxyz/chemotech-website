name: fetch-product-photos
on: push
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[photos]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p out
          while read no url; do
            curl -fsSL -A "ChemotechWebsite/1.0 (github.com/autoaimationxyz/chemotech-website)" "$url" -o "out/p$no.jpg" || echo "FAIL $no"
            sleep 1
          done < urls.txt
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add out && git commit -m "[photos] fetched" && git push
